<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extenso</title>
    <base href="/" />
    <script>
        // Project sites on GitHub Pages are served from /{repository}/.
        // Local dev stays at /. Relative image and stylesheet paths then resolve in both places.
        (function () {
            if (!location.hostname.endsWith("github.io")) {
                return;
            }

            var segment = location.pathname.split("/").filter(function (part) { return part; })[0];
            if (segment) {
                document.querySelector("base").href = "/" + segment + "/";
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <link href="css/app.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/splash.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prettify/r298/prettify.min.css" />
    <link rel="stylesheet" href="css/prettify-visual-studio.css" />
    <!--<link href="Doxie.BlazorClient.styles.css" rel="stylesheet" />-->
</head>

<body>
    <div id="app">
        <div class="splash">
            <div class="message">Loading documentation</div>
            <i class="fa fa-spinner fa-spin"></i>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-fQybjgWLrvvRgtW6bFlB7jaZrFsaBXjsOMm/tB9LTS58ONXgqbR9W8oWht/amnpF" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prettify/r298/prettify.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script type="text/javascript">
        function onShowType() {
            window.setTimeout(() => $(".nav-tabs a:not(:hidden):first").tab("show"), 200);
            window.setTimeout(() => PR.prettyPrint(), 200);
        };
    </script>
</body>

</html>
